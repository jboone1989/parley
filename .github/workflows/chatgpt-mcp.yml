name: ChatGPT MCP adapter
on:
  push:
    paths:
      - 'integrations/chatgpt-mcp/**'
      - '.github/workflows/chatgpt-mcp.yml'
  pull_request:
    paths:
      - 'integrations/chatgpt-mcp/**'
      - '.github/workflows/chatgpt-mcp.yml'
jobs:
  adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/chatgpt-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
