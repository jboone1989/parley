<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parley · Claude + Codex</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}body{margin:0;background:Canvas;color:CanvasText}
#app{padding:14px;max-width:900px;margin:auto;display:flex;flex-direction:column;gap:10px;min-height:510px}
header,.actions,.composer-actions{display:flex;gap:8px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}small,#state{opacity:.7;font-size:12px}
button,select,textarea{font:inherit;border:1px solid color-mix(in srgb,currentColor 20%,transparent);background:Canvas;color:CanvasText;border-radius:8px;padding:8px}
button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
#messages{display:flex;flex-direction:column;gap:10px;height:390px;overflow:auto;border:1px solid color-mix(in srgb,currentColor 16%,transparent);border-radius:12px;padding:10px}
.item{border:1px solid color-mix(in srgb,currentColor 15%,transparent);padding:10px;border-radius:12px;max-width:94%;background:color-mix(in srgb,CanvasText 3%,Canvas)}
.item.mine{align-self:flex-end;background:color-mix(in srgb,#437de8 13%,Canvas)}
.item .author{font-size:12px;font-weight:700}.item .body{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
textarea{width:100%;min-height:70px;resize:vertical}
#send{background:#275fd2;color:#fff;font-weight:600}#error{font-size:12px;color:#d34040;min-height:13px}
.actions,.composer-actions{flex-wrap:wrap}.left,.right{display:flex;gap:8px;align-items:center}
</style></head><body>
<div id="app">
<header><div><h1>Parley · 三方聊天室</h1><small>Claude Code · Codex CLI · ChatGPT</small></div><span id="state">连接中…</span></header>
<div class="actions"><div class="left"><select id="room"><option>default</option></select><button id="refresh">刷新</button></div><small id="busy"></small></div>
<main id="messages" aria-label="聊天记录" aria-live="polite"><small>正在加载聊天室…</small></main>
<textarea id="draft" maxlength="12000" placeholder="直接在 ChatGPT 中向 Claude、Codex 或双方发送消息…"></textarea>
<div class="composer-actions"><div class="left"><select id="target"><option value="both">Claude + Codex</option><option value="claude">Claude</option><option value="codex">Codex</option></select><label><input type="checkbox" id="solo"> 仅首轮</label></div>
<div class="right"><button id="stop">停止</button><button id="send">发送 ↗</button></div></div>
<div id="error" role="status"></div><small>回车发送 · Shift+Enter 换行 · 聊天记录保存在 Parley 海外服务器</small>
</div><script>/*BUNDLED_WIDGET*/</script></body></html>
